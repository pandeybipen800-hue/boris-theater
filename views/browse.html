<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Boris Theater - Browse Shows</title>
        <link rel="stylesheet" href="/style.css">
    </head>
    <body>
        <div class="navbar">
            <div>
                <a href="/">Main Menu</a>
                <a href="/browse">Browse &amp; Search Shows</a>
                <a href="/admin/add-show">Add New Show</a>
            </div>
            <div>{{ AUTH_LINK }}</div>
        </div>

        <div class="container">
            <h1>Current Performances</h1>

            <!-- Find and Filter Form (sends GET parameters to FilterShows) -->
            <form class="filter-bar" action="/browse" method="GET">
                <div class="filter-group">
                    <label>Find by Show Title</label>
                    <input type="text" name="search" value="{{SEARCH_VAL}}"
                        placeholder="e.g. Hamlet">
                </div>

                <div class="filter-group">
                    <label>Max Ticket Price ($)</label>
                    <input type="number" step="0.01" name="maxPrice"
                        value="{{PRICE_VAL}}" placeholder="e.g. 60">
                </div>

                <div>
                    <button type="submit" class="btn"
                        style="margin-top: 0;">Search / Filter</button>
                    <a href="/browse" class="btn btn-secondary"
                        style="margin-top: 0;">Reset</a>
                </div>
            </form>

            <div id="shows-container">
      {{ SHOW_CARDS }}
    </div>
        </div>
    </body>
</html>
