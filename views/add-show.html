<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Boris Theater - Add Show</title>
        <link rel="stylesheet" href="/style.css">
    </head>
    <body>
        <div class="navbar">
            <div>
                <a href="/">Main Menu</a>
                <a href="/browse">Browse &amp; Search Shows</a>
                <a href="/admin/add-show">Add New Show</a>
            </div>
            <div><a href="/logout">Logout</a></div>
        </div>

        <div class="container">
            <h1>Add New Show</h1>
            <div class="form-card">
      <!-- Validation errors from clsShow.Validate() appear right here -->
      {{ ERROR_MSG }}

      <form action="/api/add-show" method="POST">
        <label>Show Title</label>
        <input type="text" name="title" placeholder="e.g. Macbeth">

        <label>Show Date</label>
        <input type="date" name="date">

        <label>Ticket Price ($)</label>
        <input type="number" step="any" name="price" placeholder="45.00">

        <label>Available Seats</label>
        <input type="number" name="seats" placeholder="100">

        <button type="submit" class="btn">Save Show</button>
        <a href="/browse" class="btn btn-secondary">Cancel</a>
      </form>
    </div>
        </div>
    </body>
</html>
